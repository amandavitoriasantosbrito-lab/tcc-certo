<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - Amanda Beauty</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="cadastro">

  <div id="site-header"></div>

  <main class="auth-page wrap register-page">
    
    <div class="auth-image">
      <img src="assets/makeup-artista.jpeg" alt="Maquiagem">
      <div class="auth-image-copy">
        <p>Cadastre-se para agendar seus horários.</p>
      </div>
    </div>

    <section class="auth-panel">
      <h1>Criar conta</h1>
      <p class="auth-sub">Preencha os campos abaixo para fazer seu cadastro.</p>

      <form class="auth-form" id="register-form">
        <label for="register-name">Nome</label>
        <input id="register-name" name="name" type="text" placeholder="Seu nome" required>

        <label for="register-email">E-mail</label>
        <input id="register-email" name="email" type="email" placeholder="Seu e-mail" required>

        <label for="register-password">Senha</label>
        <div class="password-wrap">
          <input id="register-password" name="password" type="password" placeholder="Sua senha" required minlength="6">
          <button type="button" class="password-toggle">Ver</button>
        </div>

        <label class="check-label terms-check">
          <input type="checkbox" required> 
          <span>Aceito os termos de uso.</span>
        </label>

        <button class="button button-dark form-submit" type="submit">Cadastrar</button>
        <div class="form-feedback"></div>
      </form>

      <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="app.js"></script>
</body>
</html>
